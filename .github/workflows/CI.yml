name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Apply vendor patches
        run: ./scripts/apply-vendor-patches.sh
      - name: Build container image
        run: docker build -t pbc-glibc -f Dockerfile .
      - name: Build wheel
        run: docker run --rm -v "$PWD":/workspace -w /workspace pbc-glibc maturin build --release
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist

  musllinux:
    name: musllinux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Apply vendor patches
        run: ./scripts/apply-vendor-patches.sh
      - name: Build container image
        run: docker build -t pbc-musl -f Dockerfile.musl .
      - name: Build wheel
        run: docker run --rm -v "$PWD":/workspace -w /workspace pbc-musl maturin build --release
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.arch }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
