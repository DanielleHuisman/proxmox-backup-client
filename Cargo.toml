[package]
name = "proxmox-backup-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[lib]
name = "proxmox_backup_client"
crate-type = ["cdylib"]

[dependencies]
pbs-api-types = { path = "vendor/proxmox/pbs-api-types" }
pbs-client = { path = "vendor/proxmox-backup/pbs-client" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }

[patch.crates-io]
pathpatterns = { git = "https://git.proxmox.com/git/pathpatterns.git", rev = "5323cbe49ae5d592eb8a3fa2e215550e83dd7fba" }
pxar = { git = "https://git.proxmox.com/git/pxar.git", rev = "091a8a382d0d6fc71025351fb35c51b1f3b0074d" }

pbs-api-types = { path = "vendor/proxmox/pbs-api-types" }
proxmox-async = { path = "vendor/proxmox/proxmox-async" }
proxmox-auth-api = { path = "vendor/proxmox/proxmox-auth-api" }
proxmox-base64 = { path = "vendor/proxmox/proxmox-base64" }
proxmox-borrow = { path = "vendor/proxmox/proxmox-borrow" }
proxmox-compression = { path = "vendor/proxmox/proxmox-compression" }
proxmox-http = { path = "vendor/proxmox/proxmox-http" }
proxmox-human-byte = { path = "vendor/proxmox/proxmox-human-byte" }
proxmox-io = { path = "vendor/proxmox/proxmox-io" }
proxmox-lang = { path = "vendor/proxmox/proxmox-lang" }
proxmox-log = { path = "vendor/proxmox/proxmox-log" }
proxmox-notify = { path = "vendor/proxmox/proxmox-notify" }
proxmox-product-config = { path = "vendor/proxmox/proxmox-product-config" }
proxmox-rate-limiter = { path = "vendor/proxmox/proxmox-rate-limiter" }
proxmox-router = { path = "vendor/proxmox/proxmox-router" }
proxmox-s3-client = { path = "vendor/proxmox/proxmox-s3-client" }
proxmox-schema = { path = "vendor/proxmox/proxmox-schema" }
proxmox-section-config = { path = "vendor/proxmox/proxmox-section-config" }
proxmox-serde = { path = "vendor/proxmox/proxmox-serde" }
proxmox-shared-memory = { path = "vendor/proxmox/proxmox-shared-memory" }
proxmox-simple-config = { path = "vendor/proxmox/proxmox-simple-config" }
proxmox-sys = { path = "vendor/proxmox/proxmox-sys" }
proxmox-systemd = { path = "vendor/proxmox/proxmox-systemd" }
proxmox-time = { path = "vendor/proxmox/proxmox-time" }
proxmox-uuid = { path = "vendor/proxmox/proxmox-uuid" }
proxmox-worker-task = { path = "vendor/proxmox/proxmox-worker-task" }

[patch."https://git.proxmox.com/git/proxmox-backup.git"]
pbs-client = { path = "vendor/proxmox-backup/pbs-client" }
pbs-tools = { path = "vendor/proxmox-backup/pbs-tools" }
